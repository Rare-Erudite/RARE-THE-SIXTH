    <script>
      // Gracefully handle and suppress Vite dev HMR WebSocket disconnects in iframe/container sandbox
      (function() {
        const isViteWsError = (str) => {
          if (!str) return false;
          const s = String(str);
          return s.includes('WebSocket') || s.includes('[vite]') || s.includes('closed without opened');
        };

        window.addEventListener('error', (event) => {
          if (isViteWsError(event.message) || isViteWsError(event.error?.message) || isViteWsError(event.error?.stack)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', (event) => {
          const reasonMsg = event.reason?.message || event.reason?.stack || String(event.reason || '');
          if (isViteWsError(reasonMsg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
